[package]
name = "mentora"
version = "0.1.0"
description = "Mentora desktop app: the React frontend in a native window, the Python backend as a sidecar"
edition = "2021"

[lib]
name = "mentora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
