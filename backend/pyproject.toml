[project]
name = "mentor-backend"
version = "0.1.0"
description = "Local tutoring prototype: pluggable LLM backend, rule-driven tutor flow, full interaction logs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pypdf>=5",
    "pymupdf>=1.25",
    # PDF 方程式轉 LaTeX：Unicode → LaTeX 對照表（app/pdfdoc/math.py）
    "pylatexenc>=2.10,<3",
    "python-multipart>=0.0.9",
    # 導讀 agent 與學習流程（MENTOR_WORKFLOW=langgraph）。精確版本見 requirements.lock。
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "aiosqlite>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
openvino = ["openvino-genai>=2025.1"]
# 打包桌面版的 Python sidecar（scripts/build-sidecar.ts）
desktop = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
